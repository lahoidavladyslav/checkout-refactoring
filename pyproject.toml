[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shop-checkout"
version = "0.1.0"
description = "Checkout module of an online store: a refactoring of a legacy single-function implementation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "import-linter>=2.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "requests>=2.32",
    "responses>=0.25",
    "ruff>=0.6",
    "time-machine>=2.14",
    "types-requests>=2.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    # Starlette's TestClient still drives httpx; the replacement client is not needed here.
    "ignore:Using .httpx. with .starlette.testclient.:Warning",
]
markers = [
    "characterization: pins the observable behaviour of the legacy checkout",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PT", "PL", "TID", "T20", "S", "DTZ",
]
ignore = [
    "PLR2004", # magic values are fine in tests and obvious domain constants
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913"]
"tests/postgres/conftest.py" = ["S603"]  # fixed arguments: the server binaries found on PATH

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["shop"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.importlinter]
root_package = "shop"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain does not depend on outer layers or frameworks"
type = "forbidden"
source_modules = ["shop.domain"]
forbidden_modules = [
    "shop.application",
    "shop.infrastructure",
    "shop.api",
    "shop.composition",
    "fastapi",
    "httpx",
    "pydantic",
    "requests",
]

[[tool.importlinter.contracts]]
name = "Application does not depend on infrastructure or HTTP layer"
type = "forbidden"
source_modules = ["shop.application"]
forbidden_modules = [
    "shop.infrastructure",
    "shop.api",
    "shop.composition",
    "fastapi",
    "httpx",
    "pydantic",
    "requests",
]

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on the HTTP layer"
type = "forbidden"
source_modules = ["shop.infrastructure"]
forbidden_modules = ["shop.api", "shop.composition", "fastapi"]
